name: 🌐 TrendPulse Daily — Multi-Horizon Blog Agent

on:
  # 3 Staggered runs per day (Multi-Horizon Schedule):
  # 1. Morning Edition: 09:00 AM IST (03:30 UTC) — 24-Hour Trend Pulse (Breaking)
  # 2. Noon Edition:    02:00 PM IST (08:30 UTC) — Weekly Deep Dive & Teardown
  # 3. Evening Edition: 08:00 PM IST (14:30 UTC) — Monthly Big Picture & Future
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 8 * * *'
    - cron: '30 14 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      slot:
        description: 'Edition slot (auto / morning / noon / evening)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - noon
          - evening
      articles_count:
        description: 'Number of articles to generate in this run'
        required: false
        default: '1'

jobs:
  run-blog-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write     # needed to commit database updates back to repo

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔑 Decode Blogger token from secret
        run: |
          echo "${{ secrets.BLOGGER_TOKEN_B64 }}" | base64 -d > token.json
          echo "✅ token.json decoded successfully"

      - name: 🚀 Run blog agent
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID:   ${{ secrets.BLOGGER_BLOG_ID }}
          BLOG_SLOT:         ${{ github.event.inputs.slot != 'auto' && github.event.inputs.slot || '' }}
          ARTICLES_COUNT:    ${{ github.event.inputs.articles_count || '1' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scheduler.py

      - name: 💾 Commit updated article database & social promotions
        if: always()
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add database/published_topics.json database/social_promotions.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🤖 Auto: update published_topics.json & social promos [skip ci]"
          git pull --rebase origin main || true
          git push
